[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-memory-mvp"
version = "0.1.0"
description = "Bounded summary and reflexive memory with traceable source retrieval"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "tiktoken>=0.9,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
bench = ["huggingface-hub>=0.30,<2", "pyarrow>=19,<24"]

[tool.setuptools.packages.find]
include = ["context_memory*"]

[tool.setuptools.package-data]
context_memory = ["prompts/*.txt", "scenarios/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
